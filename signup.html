<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Pizza House</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->

    <header>
        <nav class="navbar">

            <h1 class="logo">PIZZA<span> HOUSE</span></h1>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>

        </nav>
    </header>


    <!-- Sign Up Section -->

    <section class="signup-section">

        <div class="signup-box">

            <h2>CREATE YOUR ACCOUNT</h2>

            <p>Join Pizza House and enjoy our delicious pizzas!</p>

            <form action="#" method="get">

                <label for="name">Full Name</label>

                <input type="text" id="name"
                name="fullname" placeholder="Enter your full name"
                required minlength="3">


                <label for="email">Email Address</label>

                <input type="email" id="email"
                name="email" placeholder="Enter your email"
                required>


                <label for="password">Password</label>

                <input type="password" id="password"
                name="password" placeholder="Enter your password"
                required minlength="8">


                <label for="phone">Phone Number</label>

                <input type="tel" id="phone"
                name="phone" placeholder="Enter your phone number"
                required>


                <div class="checkbox">

                    <input type="checkbox" id="terms" required>

                    <label for="terms">
                        I agree to the terms and conditions
                    </label>

                </div>


                <button type="submit" class="signup-btn">
                    CREATE ACCOUNT
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>© 2026 Pizza House. All Rights Reserved.</p>

    </footer>

</body>
</html>
